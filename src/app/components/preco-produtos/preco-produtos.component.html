<h2>Produtos</h2>

@for(product of products; track $index) {
    <div>
        <p>Produto: {{ product.name | capitalize }}</p>
        <p>Preço: {{ product.price | currency:'BRL' }}</p>
        <p>Preço com desconto: {{ product.price | discount: product.discount | currency:'BRL' }}</p>
    </div>
    <div>-------------------------------------------</div>
}
